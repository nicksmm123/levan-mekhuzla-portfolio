<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#1a1a1a"/>
  <rect x="1" y="1" width="798" height="598" fill="none" stroke="#2a2a2a" stroke-width="2"/>
  <!-- Canvas texture lines -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#222" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#222" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#222" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="0" x2="200" y2="600" stroke="#222" stroke-width="1" opacity="0.5"/>
  <line x1="400" y1="0" x2="400" y2="600" stroke="#222" stroke-width="1" opacity="0.5"/>
  <line x1="600" y1="0" x2="600" y2="600" stroke="#222" stroke-width="1" opacity="0.5"/>
  <!-- Frame icon -->
  <rect x="320" y="220" width="160" height="120" fill="none" stroke="#3a3a3a" stroke-width="3" rx="2"/>
  <rect x="340" y="240" width="120" height="80" fill="none" stroke="#333" stroke-width="1" rx="1"/>
  <!-- Mountains silhouette -->
  <polygon points="355,300 385,258 415,300" fill="#2a2a2a"/>
  <polygon points="385,300 415,268 445,300" fill="#252525"/>
  <!-- Sun circle -->
  <circle cx="430" cy="255" r="10" fill="#2e2e2e"/>
</svg>
